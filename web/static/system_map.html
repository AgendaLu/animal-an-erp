<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Animal-AN 系統架構圖</title>
<style>
  :root{
    --bg:#EEF1EF; --card:#FFFFFF; --ink:#22303C; --muted:#67788A; --line:#8895A3;
    --z-master:#5B7185; --z-purchase:#A8702A; --z-inv:#3E7D5D;
    --z-sales:#3D6B99; --z-acct:#7D5595; --z-report:#A2543F; --z-legacy:#98999B;
    --font-sans:"Avenir Next","PingFang TC","Microsoft JhengHei",-apple-system,sans-serif;
    --font-mono:"SF Mono",ui-monospace,Menlo,monospace;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{height:100%;overflow:hidden}
  body{font-family:var(--font-sans);color:var(--ink);background:var(--bg)}

  /* ---------- 頂欄 ---------- */
  .topbar{position:fixed;inset:0 0 auto 0;z-index:20;display:flex;align-items:center;gap:16px;
    padding:10px 18px;background:rgba(255,255,255,.92);backdrop-filter:blur(6px);
    border-bottom:1px solid #D9DFDB;flex-wrap:wrap}
  .topbar h1{font-size:15px;font-weight:600;letter-spacing:.02em;white-space:nowrap}
  .topbar h1 small{font-weight:400;color:var(--muted);margin-left:8px;font-size:12px}
  .seg{display:flex;border:1px solid #C7CFD6;border-radius:8px;overflow:hidden}
  .seg button{border:none;background:transparent;padding:6px 14px;font-family:inherit;
    font-size:13px;cursor:pointer;color:var(--muted)}
  .seg button.on{background:var(--ink);color:#fff}
  .seg button:focus-visible{outline:2px solid var(--z-sales);outline-offset:-2px}
  .ctl{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--muted)}
  .ctl button{width:26px;height:26px;border:1px solid #C7CFD6;background:#fff;border-radius:6px;
    cursor:pointer;font-size:14px;line-height:1;color:var(--ink)}
  .ctl button.wide{width:auto;padding:0 10px;font-size:12px}
  .ctl button:focus-visible{outline:2px solid var(--z-sales)}
  label.chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);cursor:pointer}
  label.chk[hidden]{display:none}
  .legend{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:11.5px;color:var(--muted)}
  .legend .chip{display:inline-flex;align-items:center;gap:4px}
  .legend .chip i{width:10px;height:10px;border-radius:3px;display:inline-block}
  .legend .lstyle{display:inline-flex;align-items:center;gap:4px}
  .legend svg{vertical-align:middle}
  #focusChip{display:inline-flex;align-items:center;gap:6px;font-size:12px;color:var(--ink);
    background:#fff;border:1px solid #C7CFD6;border-radius:99px;padding:3px 6px 3px 12px}
  #focusChip b{font-weight:600}
  #focusChip button{border:none;background:#E8ECE9;border-radius:50%;width:18px;height:18px;
    cursor:pointer;font-size:10px;line-height:1;color:var(--ink)}
  #focusChip button:focus-visible{outline:2px solid var(--z-sales)}
  #focusChip[hidden]{display:none}

  /* ---------- 畫布 ---------- */
  #viewport{position:absolute;inset:0;cursor:grab;overflow:hidden;
    background-image:radial-gradient(circle,#D4DAD5 1px,transparent 1px);
    background-size:26px 26px}
  #viewport.panning{cursor:grabbing}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0}
  #edges{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
  .plate{position:absolute;border-radius:14px;pointer-events:none;
    border:1.5px dashed color-mix(in srgb,var(--z) 45%, transparent);
    background:color-mix(in srgb,var(--z) 5%, transparent)}
  .plate b{position:absolute;top:-11px;left:16px;background:var(--bg);padding:0 8px;
    font-size:12.5px;font-weight:600;letter-spacing:.12em;color:var(--z)}

  /* ---------- 卡片 ---------- */
  .card{position:absolute;background:var(--card);border-radius:10px;cursor:pointer;
    border:1px solid color-mix(in srgb,var(--z) 35%, #DEE3E0);
    box-shadow:0 1px 3px rgba(34,48,60,.10),0 4px 14px rgba(34,48,60,.06);
    transition:opacity .18s, box-shadow .18s; user-select:none}
  .card:hover{box-shadow:0 2px 6px rgba(34,48,60,.14),0 8px 22px rgba(34,48,60,.10)}
  .card.sel{box-shadow:0 0 0 2.5px var(--z),0 8px 22px rgba(34,48,60,.14)}
  .card.dim{opacity:.22}
  .card .hd{display:flex;align-items:baseline;gap:8px;padding:9px 12px;
    background:color-mix(in srgb,var(--z) 10%, #fff);
    border-bottom:1px solid color-mix(in srgb,var(--z) 22%, #E8ECE9);
    border-radius:10px 10px 0 0}
  .card .hd .dot{width:9px;height:9px;border-radius:3px;background:var(--z);flex:none;align-self:center}

  .card.biz{width:290px}
  .card.biz .hd b{font-size:14.5px;font-weight:600}
  .card.biz .sub{padding:8px 12px 2px;font-size:12px;color:var(--muted);line-height:1.5}
  .card.biz ul{list-style:none;padding:6px 12px 11px}
  .card.biz li{font-size:12px;line-height:1.45;padding:2.5px 0 2.5px 14px;position:relative}
  .card.biz li::before{content:"";position:absolute;left:2px;top:9px;width:5px;height:5px;
    border-radius:50%;background:color-mix(in srgb,var(--z) 65%, #fff)}

  .card.uml{width:300px}
  .card.uml .hd code{font-family:var(--font-mono);font-size:12.5px;font-weight:600}
  .card.uml .hd .zh{font-size:11.5px;color:var(--muted);margin-left:auto}
  .card.uml ul{list-style:none;padding:5px 0}
  .card.uml li{display:flex;align-items:baseline;gap:6px;padding:1.5px 12px;font-size:11px;
    font-family:var(--font-mono);font-variant-numeric:tabular-nums}
  .card.uml li i{flex:none;font-style:normal;font-size:9px;font-weight:700;width:20px;
    letter-spacing:.04em;color:#fff;text-align:center;border-radius:3px;padding:1px 0;
    background:transparent;visibility:hidden}
  .card.uml li.pk i{background:var(--ink);visibility:visible}
  .card.uml li.fk i{background:color-mix(in srgb,var(--z) 80%, #333);visibility:visible}
  .card.uml li code{color:var(--ink)}
  .card.uml li.pk code{font-weight:700}
  .card.uml li .t{margin-left:auto;color:var(--muted);font-size:10px;white-space:nowrap}
  .card.uml .ft{padding:6px 12px 8px;font-size:10.5px;color:var(--muted);
    border-top:1px dashed #E2E7E3}

  /* 狀態機視圖 */
  .card.sm-state{width:300px;border-radius:18px}
  .card.sm-state .hd{border-radius:18px 18px 0 0}
  .card.sm-state .hd b{font-size:14px;font-weight:600}
  .card.sm-state ul{list-style:none;padding:7px 14px 11px}
  .card.sm-state li{font-size:11.5px;line-height:1.55;color:var(--muted);
    font-variant-numeric:tabular-nums}
  .card.sm-state li:first-child{color:var(--ink);font-family:var(--font-mono);font-size:11px}
  .card.sm-note{width:250px;border-style:dashed;border-width:1.5px;border-radius:4px;
    background:color-mix(in srgb,var(--z) 4%, #FFFDF8)}
  .card.sm-note .hd{background:transparent;border-bottom:1px dashed color-mix(in srgb,var(--z) 30%, #E8ECE9);
    border-radius:4px 4px 0 0;padding:7px 12px}
  .card.sm-note .hd b{font-size:12.5px;font-weight:600}
  .card.sm-note ul{list-style:none;padding:6px 12px 9px}
  .card.sm-note li{font-size:11px;line-height:1.5;color:var(--muted)}
  .card.sm-start,.card.sm-end{width:26px;height:26px;border-radius:50%;background:var(--ink);
    border:none;box-shadow:0 1px 4px rgba(34,48,60,.3)}
  .card.sm-end{background:#fff;border:2.5px solid var(--ink)}
  .card.sm-end::after{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--ink)}
  .edge.notelink path{stroke-dasharray:2 4;stroke-width:1.2}

  /* ---------- 邊線 ---------- */
  .edge path{fill:none;stroke:var(--line);stroke-width:1.6}
  .edge.logic path{stroke-dasharray:5 4}
  .edge.flow path{stroke-width:2}
  .edge text{font-family:var(--font-sans);font-size:10.5px;fill:var(--muted);
    paint-order:stroke;stroke:var(--bg);stroke-width:3.5px;stroke-linejoin:round}
  .edge.dim{opacity:.12}
  .edge.hot path{stroke:var(--ink);stroke-width:2.4}
  .edge.hot text{fill:var(--ink);font-weight:600}

  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);z-index:20;
    font-size:11.5px;color:var(--muted);background:rgba(255,255,255,.9);
    padding:5px 14px;border-radius:99px;border:1px solid #DDE2DE;white-space:nowrap}
  @media (prefers-reduced-motion:reduce){.card,.edge{transition:none}}
</style>
</head>
<body>

<div class="topbar">
  <h1>Animal-AN 系統架構圖<small id="counts"></small></h1>
  <div class="seg" role="tablist">

  <div class="legend" id="legend"></div>
</div>

<div id="viewport">
  <div id="stage">

      <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
        <path d="M0 0 L10 5 L0 10 z" fill="#8895A3"/></marker>

        <path d="M0 0 L10 5 L0 10 z" fill="#22303C"/></marker>
    </defs><g id="eg"></g></svg>
    <div id="plates"></div>
    <div id="cards"></div>
  </div>
</div>
<div class="hint">拖曳空白處平移　·　滾輪縮放　·　點卡片檢視關聯　·　卡片可拖曳調整位置</div>

/* ================= 畫布引擎 ================= */
const $ = s=>document.querySelector(s);
const viewport=$('#viewport'), stage=$('#stage'), eg=$('#eg'),
      cardsEl=$('#cards'), platesEl=$('#plates'), edgesSvg=$('#edges');
let view='biz', expand=false;
let tx=0, ty=0, scale=1, sel=null;
const pos={};   // 每視圖記住拖曳後座標 pos[view][id]=[x,y]

function data(){ return view==='biz' ? BIZ : view==='sm' ? STM : UML; }

function applyTransform(){ stage.style.transform=`translate(${tx}px,${ty}px) scale(${scale})`; }

function render(){
  const d=data(); sel=null;
  edgesSvg.setAttribute('width',d.size[0]); edgesSvg.setAttribute('height',d.size[1]);
  platesEl.innerHTML=''; cardsEl.innerHTML='';
  (d.plates||[]).forEach(([z,x,y,w,h,label])=>{
    const p=document.createElement('div'); p.className='plate';
    p.style.cssText=`--z:${ZONES[z][1]};left:${x}px;top:${y}px;width:${w}px;height:${h}px`;
    p.innerHTML=`<b>${label||ZONES[z][0]}</b>`; platesEl.appendChild(p);
  });
  d.nodes.forEach(n=>{
    const id = view==='biz'? n[0] : n.id;
    const zone = view==='biz'? n[1] : n.zone;
    const saved=(pos[view]||{})[id];
    const x=saved?saved[0]:(view==='biz'?n[2]:n.x), y=saved?saved[1]:(view==='biz'?n[3]:n.y);
    const c=document.createElement('div');
    c.className='card '+(view==='biz'?'biz':view==='sm'?('sm sm-'+n.type):'uml');
    c.dataset.id=id;
    c.style.cssText=`--z:${ZONES[zone][1]};left:${x}px;top:${y}px`;
    if(view==='biz'){
      c.innerHTML=`<div class="hd"><span class="dot"></span><b>${n[4]}</b></div>
        <p class="sub">${n[5]}</p><ul>${n[6].map(f=>`<li>${f}</li>`).join('')}</ul>`;
    }else if(view==='sm'){
      if(n.type==='start'||n.type==='end'){
        c.setAttribute('title', n.type==='start'?'起點':'終點');
      }else{
        c.innerHTML=`<div class="hd"><span class="dot"></span><b>${n.title}</b></div>
          <ul>${n.lines.map(l=>`<li>${l}</li>`).join('')}</ul>`;
      }
    }else{
      const fs=expand? n.fields : n.fields.filter(f=>/[PFK]/.test(f[2]));
      c.innerHTML=`<div class="hd"><span class="dot"></span><code>${n.id}</code><span class="zh">${n.zh}</span></div>
        <ul>${fs.map(f=>{
          const cls=f[2].includes('P')?'pk':f[2].includes('F')?'fk':'';
          const badge=f[2].includes('P')?'PK':f[2].includes('F')?'FK':'';
          const typ=f[3]?`→ ${f[3]}`:f[1]+(f[2].includes('U')?' · UQ':'');
          return `<li class="${cls}"><i>${badge}</i><code>${f[0]}</code><span class="t">${typ}</span></li>`;
        }).join('')}</ul>
        <div class="ft">${expand?`共 ${n.fields.length} 欄`:`顯示 ${fs.length} / ${n.fields.length} 欄`}${n.note?`　·　${n.note}`:''}</div>`;
    }
    cardsEl.appendChild(c);
  });
  $('#counts').textContent = view==='biz'
    ? `　${d.nodes.length} 個功能・${d.edges.length} 條流程`
    : view==='sm'
    ? `　${d.nodes.filter(n=>n.type==='state').length} 個狀態・${d.edges.filter(e=>e[3]!==2).length} 個轉換・${d.nodes.filter(n=>n.type==='note').length} 張報表`
    : `　${d.nodes.length} 張資料表・${d.edges.length} 條關聯`;
  drawEdges(); fit();
}

function rectOf(id){
  const el=cardsEl.querySelector(`[data-id="${CSS.escape(id)}"]`);
  return {x:el.offsetLeft, y:el.offsetTop, w:el.offsetWidth, h:el.offsetHeight, el};
}

function drawEdges(){
  const d=data(); eg.innerHTML='';
  d.edges.forEach(([a,b,label,strong],i)=>{
    const ra=rectOf(a), rb=rectOf(b);
    const acx=ra.x+ra.w/2, acy=ra.y+ra.h/2, bcx=rb.x+rb.w/2, bcy=rb.y+rb.h/2;
    const dx=bcx-acx, dy=bcy-acy;
    let p1,p2,c1,c2;
    if(Math.abs(dx)>=Math.abs(dy)){
      const s=dx>0?1:-1;
      p1=[acx+s*ra.w/2, acy]; p2=[bcx-s*rb.w/2, bcy];
      const k=Math.max(40,Math.abs(dx)*0.35);
      c1=[p1[0]+s*k,p1[1]]; c2=[p2[0]-s*k,p2[1]];
    }else{
      const s=dy>0?1:-1;
      p1=[acx, acy+s*ra.h/2]; p2=[bcx, bcy-s*rb.h/2];
      const k=Math.max(40,Math.abs(dy)*0.35);
      c1=[p1[0],p1[1]+s*k]; c2=[p2[0],p2[1]-s*k];
    }
    const g=document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('class','edge'+(strong===2?' notelink':strong?' flow':' logic'));
    g.dataset.a=a; g.dataset.b=b;
    const path=document.createElementNS('http://www.w3.org/2000/svg','path');
    path.setAttribute('d',`M${p1[0]},${p1[1]} C${c1[0]},${c1[1]} ${c2[0]},${c2[1]} ${p2[0]},${p2[1]}`);
    if(strong!==2) path.setAttribute('marker-end','url(#arr)');
    g.appendChild(path);
    if(label){
      const mx=(p1[0]+3*c1[0]+3*c2[0]+p2[0])/8, my=(p1[1]+3*c1[1]+3*c2[1]+p2[1])/8;
      const t=document.createElementNS('http://www.w3.org/2000/svg','text');
      t.setAttribute('x',mx); t.setAttribute('y',my-5); t.setAttribute('text-anchor','middle');
      t.textContent=label; g.appendChild(t);
    }
    eg.appendChild(g);
  });
  refreshHighlight();
}

/* ---------- 頁面聚焦：依 SPA 目前頁面高亮相關卡片與流程 ---------- */
const PAGE_LABELS={dashboard:'儀表板',purchase:'建立進貨單',inventory:'庫存/分裝',
  'bulk-items':'原物料',products:'產品',sales:'建立銷貨單',suppliers:'供應商',
  customers:'客戶','sales-invoice':'銷售發票','purchase-invoice':'採購發票',
  payment:'收付款',reports:'報表'};
const FOCUS={
 biz:{
  purchase:{primary:'po',set:['supplier','bulk','po','bulkstock','ledger']},
  inventory:{primary:'repack',set:['bulkstock','repack','sellstock','product','ledger']},
  'bulk-items':{primary:'bulk',set:['bulk','po','bulkstock']},
  products:{primary:'product',set:['product','repack','sellstock']},
  sales:{primary:'so',set:['sellstock','so','customer','ledger','sinv']},
  suppliers:{primary:'supplier',set:['supplier','po','pinv','ap']},
  customers:{primary:'customer',set:['customer','so','sinv','ar']},
  'sales-invoice':{primary:'sinv',set:['so','sinv','ar','pay','tax']},
  'purchase-invoice':{primary:'pinv',set:['supplier','pinv','ap','pay','tax']},
  payment:{primary:'pay',set:['pay','ar','ap','sinv','pinv']},
  reports:{primary:'report',set:['report','ledger','tax','ar']},
 },
 uml:{
  purchase:{primary:'purchase_orders',set:['suppliers','purchase_orders','purchase_order_items','materials','material_batches','inventory_transactions']},
  inventory:{primary:'repack_orders',set:['material_batches','repack_orders','batches','products','inventory_transactions']},
  'bulk-items':{primary:'materials',set:['materials','material_batches','suppliers','products']},
  products:{primary:'products',set:['products','batches','materials','supplier_products']},
  sales:{primary:'sales_orders',set:['sales_orders','sales_order_items','customers','batches','inventory_transactions']},
  suppliers:{primary:'suppliers',set:['suppliers','supplier_products','purchase_orders','purchase_invoices','accounts_payable']},
  customers:{primary:'customers',set:['customers','sales_orders','sales_invoices','accounts_receivable']},
  'sales-invoice':{primary:'sales_invoices',set:['sales_orders','sales_invoices','sales_transactions','accounts_receivable','payment_records','tax_records']},
  'purchase-invoice':{primary:'purchase_invoices',set:['purchase_orders','purchase_invoices','purchase_transactions','accounts_payable','payment_records','tax_records']},
  payment:{primary:'payment_records',set:['payment_records','sales_invoices','purchase_invoices','accounts_receivable','accounts_payable']},
  reports:{primary:'tax_records',set:['inventory_movements','inventory_counts','tax_records','accounts_receivable','accounts_payable']},
 },
 sm:{
  purchase:{primary:'s_bulk',set:['start','s_bulk','s_bulk_exp','n_inv','n_expire','n_ledger']},
  inventory:{primary:'s_sell',set:['s_bulk','s_bulk_exp','s_sell','s_sell_exp','n_repack','n_inv','n_ledger']},
  'bulk-items':{primary:'s_bulk',set:['start','s_bulk','s_bulk_exp','n_inv','n_expire']},
  products:{primary:'s_sell',set:['s_sell','s_sell_exp','n_inv','n_expire']},
  sales:{primary:'s_sold',set:['s_sell','s_sell_exp','s_sold','n_sales','n_ledger']},
  customers:{primary:'s_sold',set:['s_sold','s_unpaid','s_overdue','n_ar']},
  'sales-invoice':{primary:'s_unpaid',set:['s_sold','s_unpaid','s_partial','s_paid','n_ar','n_tax']},
  payment:{primary:'s_paid',set:['s_unpaid','s_partial','s_overdue','s_paid','end','n_ar']},
  reports:{primary:'n_sales',set:['n_inv','n_expire','n_repack','n_ledger','n_sales','n_ar','n_tax']},
 }
};
let focusPage=null;

function refreshHighlight(){
  const d=data();
  const rel=new Set();
  let mode=null, primary=null;
  if(sel){
    mode='sel'; rel.add(sel);
    d.edges.forEach(([a,b])=>{ if(a===sel)rel.add(b); if(b===sel)rel.add(a); });
  }else{
    const f=focusPage && FOCUS[view][focusPage];
    if(f){ mode='focus'; f.set.forEach(x=>rel.add(x)); primary=f.primary; }
  }
  cardsEl.querySelectorAll('.card').forEach(c=>{
    c.classList.toggle('sel', sel===c.dataset.id || (mode==='focus' && c.dataset.id===primary));
    c.classList.toggle('dim', !!mode && !rel.has(c.dataset.id));
  });
  eg.querySelectorAll('.edge').forEach(e=>{
    const hot = mode==='sel' ? (e.dataset.a===sel||e.dataset.b===sel)
              : mode==='focus' ? (rel.has(e.dataset.a)&&rel.has(e.dataset.b))
              : false;
    e.classList.toggle('hot',hot);
    e.classList.toggle('dim',!!mode && !hot);
    if(!e.classList.contains('notelink'))
      e.querySelector('path').setAttribute('marker-end',hot?'url(#arrHot)':'url(#arr)');
  });
  const chip=document.getElementById('focusChip');
  const active = mode!=='sel' && focusPage && FOCUS[view][focusPage];
  chip.hidden=!active;
  if(active) chip.querySelector('b').textContent=PAGE_LABELS[focusPage]||focusPage;
}

function setFocusPage(page){
  focusPage = (FOCUS.biz[page]||FOCUS.uml[page]) ? page : null;
  sel=null; refreshHighlight();
}
addEventListener('message',e=>{
  const m=e.data;
  if(m && m.type==='focus') setFocusPage(m.page);
});
{ const qp=new URLSearchParams(location.search).get('focus'); if(qp) focusPage=(FOCUS.biz[qp]||FOCUS.uml[qp])?qp:null; }

/* ---------- 平移 / 縮放 / 拖曳 ---------- */
function fit(){
  const th=document.querySelector('.topbar').offsetHeight;
  const d=data(), vw=viewport.clientWidth, vh=viewport.clientHeight-th;
  let minX=1e9,minY=1e9,maxX=-1e9,maxY=-1e9;
  cardsEl.querySelectorAll('.card').forEach(c=>{
    minX=Math.min(minX,c.offsetLeft); minY=Math.min(minY,c.offsetTop);
    maxX=Math.max(maxX,c.offsetLeft+c.offsetWidth); maxY=Math.max(maxY,c.offsetTop+c.offsetHeight);
  });
  const pad=60, w=maxX-minX+pad*2, h=maxY-minY+pad*2;
  scale=Math.min(vw/w, vh/h, 1.15);
  tx=(vw-w*scale)/2-(minX-pad)*scale; ty=th+(vh-h*scale)/2-(minY-pad)*scale;
  applyTransform();
}
function zoomAt(f,cx,cy){
  const ns=Math.min(2.2,Math.max(0.15,scale*f));
  tx=cx-(cx-tx)*ns/scale; ty=cy-(cy-ty)*ns/scale; scale=ns; applyTransform();
}
viewport.addEventListener('wheel',e=>{ e.preventDefault(); zoomAt(Math.exp(-e.deltaY*0.0012),e.clientX,e.clientY); },{passive:false});
$('#zIn').onclick=()=>zoomAt(1.25,viewport.clientWidth/2,viewport.clientHeight/2);
$('#zOut').onclick=()=>zoomAt(0.8,viewport.clientWidth/2,viewport.clientHeight/2);
$('#zFit').onclick=fit;

let drag=null;
viewport.addEventListener('pointerdown',e=>{
  const card=e.target.closest('.card');
  drag={x0:e.clientX,y0:e.clientY,moved:false,card,
        cx:card?card.offsetLeft:0, cy:card?card.offsetTop:0, tx0:tx, ty0:ty};
  viewport.setPointerCapture(e.pointerId);
  if(!card) viewport.classList.add('panning');
});
viewport.addEventListener('pointermove',e=>{
  if(!drag) return;
  const dx=e.clientX-drag.x0, dy=e.clientY-drag.y0;
  if(Math.abs(dx)+Math.abs(dy)>4) drag.moved=true;
  if(!drag.moved) return;
  if(drag.card){
    drag.card.style.left=(drag.cx+dx/scale)+'px';
    drag.card.style.top =(drag.cy+dy/scale)+'px';
    drawEdges();
  }else{
    tx=drag.tx0+dx; ty=drag.ty0+dy; applyTransform();
  }
});
viewport.addEventListener('pointerup',e=>{
  viewport.classList.remove('panning');
  if(!drag) return;
  if(drag.card){
    if(drag.moved){
      (pos[view]=pos[view]||{})[drag.card.dataset.id]=[drag.card.offsetLeft,drag.card.offsetTop];
    }else{
      sel = sel===drag.card.dataset.id ? null : drag.card.dataset.id;
      refreshHighlight();
    }
  }else if(!drag.moved){ sel=null; refreshHighlight(); }
  drag=null;
});

/* ---------- 檢視切換 / 圖例 ---------- */
function setView(v){
  view=v;
  $('#btnBiz').classList.toggle('on',v==='biz');
  $('#btnUml').classList.toggle('on',v==='uml');
  $('#btnSm').classList.toggle('on',v==='sm');
  $('#expandWrap').hidden = v!=='uml';
  buildLegend(); render();
}
$('#btnBiz').onclick=()=>setView('biz');
$('#btnUml').onclick=()=>setView('uml');
$('#btnSm').onclick=()=>setView('sm');
$('#expandAll').onchange=e=>{ expand=e.target.checked; render(); };

function buildLegend(){
  const zones = view==='biz'
    ? ['master','purchase','inv','sales','acct','report']
    : view==='sm'
    ? ['purchase','inv','sales','acct','report']
    : ['master','purchase','inv','sales','acct','report','legacy'];
  const solid = view==='biz'?'主要流程':view==='sm'?'行為轉換':'資料庫外鍵';
  const dashed = view==='sm'?'條件（自動觸發）':'邏輯關聯';
  $('#legend').innerHTML =
    zones.map(z=>`<span class="chip"><i style="background:${ZONES[z][1]}"></i>${ZONES[z][0]}</span>`).join('') +
    `<span class="lstyle"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#8895A3" stroke-width="2"/></svg>${solid}</span>
     <span class="lstyle"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#8895A3" stroke-width="1.6" stroke-dasharray="5 4"/></svg>${dashed}</span>` +
    (view==='sm'?`<span class="lstyle"><svg width="26" height="8"><line x1="0" y1="4" x2="26" y2="4" stroke="#8895A3" stroke-width="1.2" stroke-dasharray="2 4"/></svg>報表關聯</span>`:'');
}

document.getElementById('focusClear').onclick=()=>{ focusPage=null; refreshHighlight(); };

addEventListener('resize',fit);
buildLegend(); render();
</script>
